name: Test Rich Message (разовая проверка)

# Только ручной запуск — этот workflow существует исключительно для того,
# чтобы один раз проверить, действительно ли Telegram API поддерживает
# sendRichMessage для вашего бота. Никак не связан с основным дайджестом:
# не трогает main.py, не пишет в sent_urls.json/last_run.json, не мешает
# основному расписанию.
on:
  workflow_dispatch:

jobs:
  test-rich-message:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python rich_message_test/test_rich_message.py
