name: Automated Intelligence Pipeline

on:
  schedule:
    - cron: '0 5 * * *'
      timezone: 'Europe/Moscow'
    - cron: '0 10 * * *'
      timezone: 'Europe/Moscow'
    - cron: '0 17 * * *'
      timezone: 'Europe/Moscow'
  workflow_dispatch: {}

jobs:
  run-analytics-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests feedparser beautifulsoup4 pyTelegramBotAPI

    - name: Run Python script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python main.py

    - name: Commit and push sent news history
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add sent_urls.json
        git commit -m "Update sent news history [skip ci]" || echo "No changes to commit"
        git pull --rebase origin main
        git push
