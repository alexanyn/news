name: Automated Intelligence Pipeline

on:
  schedule:
    # ИСПРАВЛЕНО 2026-08-17 (вторая итерация): сегодня afternoon-прогон
    # сработал сам, но с опозданием в 86 минут (должен был в 9:30 UTC,
    # реально стартовал в 10:56 UTC). Это НЕ проблема регистрации из вчерашней
    # правки — это официально задокументированное поведение GitHub Actions:
    # "The schedule event can be delayed during periods of high loads...
    # High load times include the start of every hour... If the load is
    # sufficiently high enough, some queued jobs may be dropped. To decrease
    # the chance of delay, schedule your workflow to run at a different
    # time of the hour" (docs.github.com/actions, подтверждено в десятках
    # обсуждений на github.com/orgs/community/discussions).
    # Проблема в том, что ":30" — вторая по популярности минута в мире после
    # ":00" (все, кто наивно ставит "каждые полчаса", ставят её же), из-за
    # чего в момент :30 у GitHub скапливается очередь и задачи запускаются
    # с опозданием, иногда — по документации — вообще отбрасываются.
    # Сообщество рекомендует смещаться на "некруглую" минуту (7, 13, 17...),
    # чтобы не стоять в этой толпе. Заодно увеличил буфер перед публикацией
    # с 30 до 53 минут — 30-минутный запас сегодня не спас от 86-минутной
    # задержки, 53 минуты не гарантия, но покрывает бОльшую часть типичных
    # по документации задержек (5-30 мин, изредка больше).

    # Morning digest (логически 08:00 МСК)
    # 7:07 МСК = 4:07 UTC
    - cron: '7 4 * * *'

    # Afternoon digest (логически 13:00 МСК)
    # 12:07 МСК = 9:07 UTC
    - cron: '7 9 * * *'

    # Evening digest (логически 19:00 МСК)
    # 18:07 МСК = 15:07 UTC
    - cron: '7 15 * * *'
  
  workflow_dispatch:
    inputs:
      schedule_name:
        description: 'Какой дайджест запустить вручную'
        required: true
        default: 'afternoon'
        type: choice
        options:
          - morning
          - afternoon
          - evening

jobs:
  run-analytics-pipeline:
    runs-on: ubuntu-latest
    # ИСПРАВЛЕНО 2026-08-17: буфер ожидания вырос с ~30 до ~53 минут (см.
    # комментарий у cron выше), плюс сбор RSS/Telegram (теперь параллельно,
    # но в худшем случае — минуты), плюс Gemini с retry (до ~20 минут в
    # худшем случае). 90 минут — запас с хорошим зазором даже для
    # пессимистичного сценария (53 буфер, который перекрывается с
    # обработкой, а не суммируется — см. пояснение в main.py у
    # wait_until_publish_time); если что-то реально зависло дольше, лучше
    # упасть с ошибкой, чем висеть до дефолтных 360 минут GitHub Actions.
    timeout-minutes: 90

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests feedparser beautifulsoup4 pyTelegramBotAPI

    - name: Determine schedule name
      id: schedule
      run: |
        # ВАЖНО: определяем schedule_name НЕ по вычисленному текущему часу
        # (это было хрупко — GitHub Actions cron может опаздывать на 5-40+ минут
        # при нагрузке, из-за чего вычисленный час "съезжал" и попадал в неверную
        # ветку, либо ни в одну, что приводило к дублированию/пропуску дайджестов).
        #
        # Вместо этого используем github.event.schedule — точную cron-строку,
        # которая реально инициировала запуск. Это значение проставляет сам
        # GitHub при срабатывании триггера, оно не зависит от времени выполнения.
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "schedule_name=${{ github.event.inputs.schedule_name }}" >> $GITHUB_OUTPUT
        elif [ "${{ github.event.schedule }}" = "7 4 * * *" ]; then
          echo "schedule_name=morning" >> $GITHUB_OUTPUT
        elif [ "${{ github.event.schedule }}" = "7 9 * * *" ]; then
          echo "schedule_name=afternoon" >> $GITHUB_OUTPUT
        elif [ "${{ github.event.schedule }}" = "7 15 * * *" ]; then
          echo "schedule_name=evening" >> $GITHUB_OUTPUT
        else
          echo "❌ Неизвестный триггер расписания: '${{ github.event.schedule }}'"
          exit 1
        fi
        echo "Определено расписание: $(cat $GITHUB_OUTPUT)"

    - name: Run digest
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python main.py ${{ steps.schedule.outputs.schedule_name }}

    - name: Commit and push sent news history and schedule tracking
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add sent_urls.json last_run.json
        git commit -m "Update news history and schedule tracking [skip ci]" || echo "No changes to commit"
        git pull --rebase origin main
        git push
