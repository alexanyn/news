name: Automated Intelligence Pipeline

on:
  schedule:
    # 05:12 UTC = 08:12 МСК (Обход пиковой нагрузки GitHub в :00)
    # 10:12 UTC = 13:12 МСК
    # 17:12 UTC = 20:12 МСК
    - cron: '12 5,10,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-analytics-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run analysis script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit and push sent news history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_urls.json
          git commit -m "Update sent news history [skip ci]" || exit 0
          git push
