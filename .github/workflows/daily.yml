name: Automated Daily Intelligence Pipeline

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  run-analytics-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run analysis script
        env:
          GEMINI_API_KEY: ${{ secrets.AIzaSyAcwMkPTKky1TtqLn1Niwo97Jwva_IniCM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.8957822342:AAG4L2XltTQEcvRg7I21BbtPxiPmHxah7y4 }}
          TELEGRAM_CHAT_ID: ${{ secrets.-1003972268688 }}
        run: python main.py
