name: Automated Intelligence Pipeline

on:
  schedule:
    # ИСПРАВЛЕНО 2026-08-17: убрали "timezone: Europe/Moscow", перешли на
    # прямые UTC-времена. Причина: сегодняшний прогон morning (7:30 МСК по
    # старому cron) не появился в Actions ВООБЩЕ — ни failed, ни cancelled,
    # просто отсутствует, при этом afternoon/evening вчера отработали штатно.
    # Это соответствует известному классу проблем на стороне GitHub: недавно
    # изменённый scheduled workflow иногда не регистрируется планировщиком
    # (см. github.com/orgs/community/discussions/185024 и #185081) — cron
    # триггер молча не срабатывает, хотя workflow_dispatch работает нормально.
    # Сообщество репортит, что новый push в репозиторий обычно чинит
    # регистрацию — этот коммит сам по себе такой push.
    # Заодно поле "timezone:" в cron — сравнительно новая фича GitHub Actions
    # (появилась в марте 2026), а прямой UTC работает без сюрпризов с самого
    # начала существования GitHub Actions. Москва не переходит на летнее
    # время (постоянный UTC+3), поэтому конвертация ниже точная и не потребует
    # пересмотра при смене сезона.

    # Morning digest (логически 08:00 МСК, собирает новости 20:00 вчера – 08:00 сегодня)
    # 7:30 МСК = 4:30 UTC — скрипт соберёт новости и ДОЖДЁТСЯ 08:00 МСК перед публикацией
    - cron: '30 4 * * *'

    # Afternoon digest (логически 13:00 МСК, собирает новости 08:00 – 13:00)
    # 12:30 МСК = 9:30 UTC
    - cron: '30 9 * * *'

    # Evening digest (логически 19:00 МСК, собирает новости 13:00 – 19:00)
    # 18:30 МСК = 15:30 UTC
    - cron: '30 15 * * *'
  
  workflow_dispatch:
    inputs:
      schedule_name:
        description: 'Какой дайджест запустить вручную'
        required: true
        default: 'afternoon'
        type: choice
        options:
          - morning
          - afternoon
          - evening

jobs:
  run-analytics-pipeline:
    runs-on: ubuntu-latest
    # Скрипт теперь может ждать до ~30-40 минут перед публикацией (см.
    # wait_until_publish_time в main.py), плюс время на сбор RSS/Telegram и
    # анализ Gemini. 60 минут — достаточный запас с учётом сетевых задержек;
    # если что-то реально зависло дольше, лучше упасть с ошибкой, чем висеть
    # до дефолтных 360 минут GitHub Actions.
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests feedparser beautifulsoup4 pyTelegramBotAPI

    - name: Determine schedule name
      id: schedule
      run: |
        # ВАЖНО: определяем schedule_name НЕ по вычисленному текущему часу
        # (это было хрупко — GitHub Actions cron может опаздывать на 5-40+ минут
        # при нагрузке, из-за чего вычисленный час "съезжал" и попадал в неверную
        # ветку, либо ни в одну, что приводило к дублированию/пропуску дайджестов).
        #
        # Вместо этого используем github.event.schedule — точную cron-строку,
        # которая реально инициировала запуск. Это значение проставляет сам
        # GitHub при срабатывании триггера, оно не зависит от времени выполнения.
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "schedule_name=${{ github.event.inputs.schedule_name }}" >> $GITHUB_OUTPUT
        elif [ "${{ github.event.schedule }}" = "30 4 * * *" ]; then
          echo "schedule_name=morning" >> $GITHUB_OUTPUT
        elif [ "${{ github.event.schedule }}" = "30 9 * * *" ]; then
          echo "schedule_name=afternoon" >> $GITHUB_OUTPUT
        elif [ "${{ github.event.schedule }}" = "30 15 * * *" ]; then
          echo "schedule_name=evening" >> $GITHUB_OUTPUT
        else
          echo "❌ Неизвестный триггер расписания: '${{ github.event.schedule }}'"
          exit 1
        fi
        echo "Определено расписание: $(cat $GITHUB_OUTPUT)"

    - name: Run digest
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python main.py ${{ steps.schedule.outputs.schedule_name }}

    - name: Commit and push sent news history and schedule tracking
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add sent_urls.json last_run.json
        git commit -m "Update news history and schedule tracking [skip ci]" || echo "No changes to commit"
        git pull --rebase origin main
        git push
