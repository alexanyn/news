name: Automated Intelligence Pipeline

on:
  # ИСПРАВЛЕНО 2026-08-19: убрали "schedule:" — расписание теперь полностью
  # на стороне cron-job.org (внешний планировщик дёргает workflow_dispatch
  # по HTTP в нужное время), это подтверждённо работает надёжнее встроенного
  # GitHub-овского cron (см. историю задержек до 86 минут и историю с полным
  # непоявлением прогона — оба случая были на "schedule:", ни разу — на
  # ручном/внешнем workflow_dispatch). Держать оба триггера одновременно
  # означало бы риск редкого дублирования прогонов без реальной пользы —
  # раз внешний планировщик работает, встроенный стал чистым риском без
  # выгоды.
  workflow_dispatch:
    inputs:
      schedule_name:
        description: 'Какой дайджест запустить (обычно дёргается cron-job.org, вручную — для теста)'
        required: true
        default: '12:00'
        type: choice
        options:
          - '09:00'
          - '12:00'
          - '15:00'
          - '18:00'
          - '21:00'

jobs:
  run-analytics-pipeline:
    runs-on: ubuntu-latest
    # Буфер перед публикацией (~53 минуты — см. настройку времени в
    # cron-job.org) плюс сбор RSS/Telegram (параллельно, минуты) плюс Gemini
    # с retry (до ~20 минут в худшем случае). 90 минут — запас с хорошим
    # зазором даже для пессимистичного сценария (буфер перекрывается с
    # обработкой, а не суммируется — см. пояснение в main.py у
    # wait_until_publish_time); если что-то реально зависло дольше, лучше
    # упасть с ошибкой, чем висеть до дефолтных 360 минут GitHub Actions.
    timeout-minutes: 90

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # ИСПРАВЛЕНО 2026-08-19: убрали pyTelegramBotAPI — main.py больше не
        # использует telebot.TeleBot, отправка идёт напрямую через requests
        # к sendRichMessage (см. main.py, _send_one_chunk).
        pip install requests feedparser beautifulsoup4 aiohttp diskcache

    - name: Determine schedule name
      id: schedule
      run: |
        # ИСПРАВЛЕНО 2026-08-19: упростили. Раньше здесь была развилка между
        # workflow_dispatch (ручной/внешний запуск) и несколькими вариантами
        # github.event.schedule (какая именно cron-строка сработала) — это
        # было нужно, пока расписание висело на встроенном "schedule:"
        # GitHub. Теперь единственный источник триггера — workflow_dispatch
        # (либо от cron-job.org по HTTP, либо вручную из интерфейса GitHub),
        # так что schedule_name всегда приходит явным входным параметром,
        # разбирать cron-строки больше не от чего.
        echo "schedule_name=${{ github.event.inputs.schedule_name }}" >> $GITHUB_OUTPUT
        echo "Определено расписание: ${{ github.event.inputs.schedule_name }}"

    - name: Run digest
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # ДОБАВЛЕНО 2026-08-27: оба секрета ниже ОПЦИОНАЛЬНЫ (см. send_alert
        # в main.py) — если не заданы в Settings → Secrets репозитория,
        # GitHub Actions подставит пустую строку, а main.py корректно
        # трактует пустую строку так же, как отсутствие переменной (не
        # падает, просто пропускает соответствующий канал оповещения).
        # TELEGRAM_ALERT_CHAT_ID — отдельный чат/канал для алертов о сбоях,
        # чтобы не мешать их с самими дайджестами (если не задан, алерты
        # идут в тот же TELEGRAM_CHAT_ID, что и дайджест, с явной пометкой).
        # ALERT_WEBHOOK_URL — Slack/Discord incoming webhook или любой другой
        # POST-эндпоинт, принимающий {"text": "..."} — независимый от
        # Telegram канал оповещения на случай, если недоступен сам Telegram
        # Bot API, а не только конкретное сообщение.
        TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      run: python main.py ${{ steps.schedule.outputs.schedule_name }}

    - name: Generate dashboard
      # ДОБАВЛЕНО 2026-08-27: собирает dashboard.html из metrics.jsonl (и
      # rss_health.json, если уже существует — см. отдельный workflow
      # rss_health.yml). Сознательно НЕ должен ронять job, даже если упадёт
      # с ошибкой (например, повреждённая строка в metrics.jsonl, которую
      # сам generate_dashboard.py не смог пропустить, или любая другая
      # непредвиденная причина) — дайджест к этому моменту уже отправлен
      # и это самое важное, визуализация не должна быть точкой отказа для
      # него. continue-on-error (а не "|| echo" как в шаге коммита ниже)
      # выбран умышленно: шаг всё равно будет виден в интерфейсе Actions
      # как жёлтый/failed, а не молча "успешным" — для дашборда мониторинга
      # видимость его собственных сбоев тоже важна.
      continue-on-error: true
      run: python generate_dashboard.py

    - name: Commit and push sent news history and schedule tracking
      run: |
        # ДОБАВЛЕНО 2026-08-26: recent_titles.json — история заголовков
        # реально отправленных новостей, используется для дедупликации по
        # похожести заголовков МЕЖДУ прогонами (см. TITLE_SIMILARITY_
        # THRESHOLD_CROSS_RUN и load_recent_titles/save_recent_titles в
        # main.py). Без коммита этого файла между прогонами GitHub Actions
        # runner эфемерен — файл создавался бы заново пустым при каждом
        # запуске, и кросс-дайджест дедупликация молча не работала бы.
        #
        # ДОБАВЛЕНО 2026-08-27: metrics.jsonl (метрики каждого прогона) и
        # dashboard.html (собранная из них панель) — по той же причине,
        # эфемерный runner.
        #
        # ИСПРАВЛЕНО 2026-08-27: раньше все файлы перечислялись в одном
        # "git add file1 file2 file3" без проверки существования. Эмпирически
        # проверено: если ХОТЯ БЫ ОДИН файл из списка не существует на диске,
        # git add падает целиком с "fatal: pathspec '...' did not match any
        # files" (exit 128) и НЕ добавляет вообще НИЧЕГО, включая остальные
        # реально существующие файлы. sent_urls.json/last_run.json/
        # recent_titles.json пишутся только внутри "if sent_anything:" в
        # main.py — то есть на прогоне, где дайджест не был отправлен (пусто,
        # сбой Telegram и т.п.), эти файлы могут не обновиться, а
        # recent_titles.json на самом первом таком прогоне после деплоя может
        # вообще ещё не существовать. dashboard.html аналогично зависит от
        # исхода отдельного шага (см. "Generate dashboard" выше,
        # continue-on-error). metrics.jsonl — единственный файл, который
        # main.py пишет БЕЗУСЛОВНО при любом исходе (см. save_run_metrics в
        # __main__), поэтому по факту всегда должен существовать, но проверка
        # ниже всё равно ничего не стоит и делает код одинаково надёжным для
        # всех файлов без специальных случаев.
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        for f in sent_urls.json last_run.json recent_titles.json metrics.jsonl dashboard.html; do
          if [ -f "$f" ]; then
            git add "$f"
          fi
        done
        git commit -m "Update news history, metrics and dashboard [skip ci]" || echo "No changes to commit"
        git pull --rebase origin main
        git push
